name: edge

on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

# The arm64 leg is a QEMU-emulated cross-build and dominates this workflow's wall
# clock, so a run superseded by a newer push is worth cancelling rather than
# finishing an image nothing will pull.
concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push edge image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=edge
            COMMIT=${{ github.sha }}
          tags: ghcr.io/ankit373/mainspring:edge
