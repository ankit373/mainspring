apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mainspring.fullname" . }}-config
  labels:
    {{- include "mainspring.labels" . | nindent 4 }}
type: Opaque
stringData:
  # `config` may be given two ways, and both have to land as the same file.
  #   -f values.yaml        → a map, which needs rendering back to YAML
  #   --set-file config=…   → the file's contents, already YAML, as a string
  # Running toYaml over the string case would wrap it in a second literal block
  # scalar, so the file would start with a bare `|` and parse as a string rather
  # than a mapping — a config the server cannot load.
  config.yaml: |
    {{- if kindIs "string" .Values.config }}
    {{- .Values.config | nindent 4 }}
    {{- else }}
    {{- toYaml .Values.config | nindent 4 }}
    {{- end }}
