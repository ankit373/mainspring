apiVersion: v1
kind: Service
metadata:
  name: {{ include "mainspring.fullname" . }}
  labels:
    {{- include "mainspring.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mainspring.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.models.persistence.enabled }}
{{- if not .Values.models.persistence.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mainspring.fullname" . }}-models
  labels:
    {{- include "mainspring.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.models.persistence.size }}
  {{- with .Values.models.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
{{- end }}
